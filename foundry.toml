[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

fs_permissions = [{ access = "read", path = "./data" }]

[fuzz]
runs = 1_000

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[lint]
# Immutables use mixedCase so the public getters read naturally (assetA(), feedA(), ...).
# unwrapped-modifier-logic: `lending` is deliberately a pre/post modifier (allow max, body, allow zero, verify).
exclude_lints = ["screaming-snake-case-immutable", "unwrapped-modifier-logic", "asm-keccak256"]
ignore = ["test/*", "script/*"]

[etherscan]
# Etherscan V2 covers Robinhood Chain (robin.etherscan.io); forge has no built-in URL for 4663.
# ETHERSCAN_API_KEY=… forge verify-contract <addr> src/X.sol:X --chain 4663 --constructor-args $(cast abi-encode …) --watch
4663 = { key = "${ETHERSCAN_API_KEY}", chain = 4663, url = "https://api.etherscan.io/v2/api" }
