[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 1_000

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[lint]
# Immutables use mixedCase so the public getters read naturally (assetA(), feedA(), ...).
# unwrapped-modifier-logic: `lending` is deliberately a pre/post modifier (allow max, body, allow zero, verify).
exclude_lints = ["screaming-snake-case-immutable", "unwrapped-modifier-logic"]
ignore = ["test/*", "script/*"]
